<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Good Craft Co. | Ponda, Goa</title>
<style>html,body{margin:0;height:100%;background:#2E2F23}iframe{display:block;border:0;width:100%;height:100%}</style>
</head>
<body>
<iframe id="f" title="The Good Craft Co."></iframe>
<script>
(function () {
  var mq = window.matchMedia('(max-width: 820px)'), f = document.getElementById('f'), cur;
  function pick() {
    var next = mq.matches ? 'mobile.html' : 'desktop.html';
    if (next !== cur) { cur = next; f.src = next; }
  }
  pick();
  (mq.addEventListener ? mq.addEventListener('change', pick) : mq.addListener(pick));
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=desktop.html"></noscript>
</body>
</html>
